<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albums - JML Music</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

nav{
    background:#1a1a1a;
    padding:15px;
    text-align:center;
}

nav a{
    color:#ffcc00;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#ffcc00;
    margin-top:30px;
}

#albums-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.album-card{
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.album-card h2{
    color:#ffcc00;
}
.album-card a{
    text-decoration:none;
}

.album-card h2{
    color:#ffcc00;
}
</style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="songs.html">Songs</a>
    <a href="albums.html">Albums</a>
    <a href="artists.html">Artists</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<h1>Albums</h1>

<div id="albums-list"></div>

<script>

fetch("albums.json")
.then(response => response.json())
.then(data => {

    const albumsList =
    document.getElementById("albums-list");

    data.forEach(album => {

        albumsList.innerHTML += `
        <div class="album-card">
           <a href="album-songs.html?album=${encodeURIComponent(album.name)}">
    <h2>${album.name}</h2>
</a>
        </div>
        `;

    });

});

</script>

</body>
</html>
